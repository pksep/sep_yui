name: Linting repository

on:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: self-hosted
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Linting project
        run: bun run lint
      - name: Check types
        run: bun run vue-tsc
